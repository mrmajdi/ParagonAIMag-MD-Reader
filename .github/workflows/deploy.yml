name: Build, refresh feed and deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh the magazine feed and redeploy every 6 hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh magazine feed
        run: npm run feed

      - name: Typecheck
        run: |
          npm run typecheck -w @paragon-ai-mag/core
          npm run typecheck -w @paragon-ai-mag/web

      - name: Test renderer
        run: npm run test -w @paragon-ai-mag/core

      - name: Build
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- apps/web/public/feed.json; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/feed.json
          git commit -m "chore: refresh magazine feed"
          git push
